# Perfil "local": roda sem Docker/PostgreSQL (H2 em arquivo, modo PostgreSQL) e com dados de demonstração.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:file:./data/local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  h2:
    console:
      enabled: false

infracheck:
  security:
    jwt-secret: dev-only-secret-change-me-dev-only-secret-change-me
  seed: true
